name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Unit and integration tests
        run: go test -timeout 2m ./...
      - name: Large transfer integrity gate
        env:
          APT_PROXY_LARGE_E2E: '1'
        run: go test -timeout 4m -run 'TestE2E(LargeTransferIntegrity|ConcurrentLargeTransferIntegrity)$' ./internal/server
      - name: 1000-stream large integrity gate
        env:
          APT_PROXY_1000_LARGE_E2E: '1'
        run: go test -timeout 3m -run '^TestE2E1000StreamLargeTransferIntegrity$' ./internal/server
      - name: Race tests
        run: go test -timeout 4m -race ./...
      - name: Vet
        run: go vet ./...
      - name: Build server
        run: go build ./cmd/apt-server
      - name: Build client
        run: go build ./cmd/apt-client
