name: release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (for example v1.0.2)'
        required: true
        default: 'v1.0.2'

permissions:
  contents: write

env:
  CGO_ENABLED: '0'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Determine release ref
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
            if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid release tag: $tag"
              exit 1
            fi
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "ref=main" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "ref=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.ref }}
          fetch-depth: 0

      - name: Check Go toolchain
        shell: bash
        run: |
          set -euo pipefail
          go version
          go version | grep -Eq 'go1\.(2[3-9]|[3-9][0-9])\.'
          echo "Release build CGO_ENABLED=$CGO_ENABLED"

      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          echo '== go test (CGO disabled) =='
          CGO_ENABLED=0 go test ./...
          echo '== go test -race (CGO enabled for race detector) =='
          CGO_ENABLED=1 go test -race ./...
          echo '== go vet (CGO disabled) =='
          CGO_ENABLED=0 go vet ./...

      - name: Build release artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist package
          mkdir -p dist package

          build_target() {
            local label="$1" goos="$2" goarch="$3" goarm="${4:-}" gomips="${5:-}"
            local dir="package/apt-proxy-${label}"
            mkdir -p "$dir"
            local envs=("CGO_ENABLED=0" "GOOS=$goos" "GOARCH=$goarch")
            [[ -n "$goarm" ]] && envs+=("GOARM=$goarm")
            [[ -n "$gomips" ]] && envs+=("GOMIPS=$gomips")
            env "${envs[@]}" go build -trimpath -ldflags='-s -w' -o "$dir/apt-server" ./cmd/apt-server
            env "${envs[@]}" go build -trimpath -ldflags='-s -w' -o "$dir/apt-client" ./cmd/apt-client
            cp README.md LICENSE "$dir/"
            printf '%s\n' "APT Proxy ${{ steps.release.outputs.tag }}" "Target: ${label}" "Commit: $(git rev-parse HEAD)" "CGO_ENABLED: 0" > "$dir/BUILD-INFO.txt"
            tar -C package -czf "dist/apt-proxy-${label}.tar.gz" "apt-proxy-${label}"
          }

          build_target linux-amd64 linux amd64
          build_target linux-386 linux 386
          build_target linux-arm64 linux arm64
          build_target linux-armv7 linux arm 7
          build_target linux-armv6 linux arm 6
          build_target linux-mipsle-softfloat linux mipsle '' softfloat
          build_target linux-mipsle-hardfloat linux mipsle '' hardfloat
          build_target linux-mips-softfloat linux mips '' softfloat
          build_target linux-mips-hardfloat linux mips '' hardfloat
          build_target linux-mips64le linux mips64le
          build_target linux-mips64 linux mips64
          build_target linux-riscv64 linux riscv64
          build_target linux-ppc64le linux ppc64le
          build_target linux-s390x linux s390x

          for target in \
            'windows-amd64 windows amd64 .exe' \
            'windows-arm64 windows arm64 .exe' \
            'darwin-amd64 darwin amd64' \
            'darwin-arm64 darwin arm64'; do
            read -r label goos goarch ext <<< "$target"
            dir="package/apt-proxy-${label}"
            mkdir -p "$dir"
            env CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" go build -trimpath -ldflags='-s -w' -o "$dir/apt-server${ext:-}" ./cmd/apt-server
            env CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" go build -trimpath -ldflags='-s -w' -o "$dir/apt-client${ext:-}" ./cmd/apt-client
            cp README.md LICENSE "$dir/"
            printf '%s\n' "APT Proxy ${{ steps.release.outputs.tag }}" "Target: ${label}" "Commit: $(git rev-parse HEAD)" "CGO_ENABLED: 0" > "$dir/BUILD-INFO.txt"
            if [[ "$goos" == 'windows' ]]; then
              (cd package && zip -qr "../dist/apt-proxy-${label}.zip" "apt-proxy-${label}")
            else
              tar -C package -czf "dist/apt-proxy-${label}.tar.gz" "apt-proxy-${label}"
            fi
          done

          for binary in package/*/apt-server package/*/apt-client; do
            if file "$binary" | grep -q 'dynamically linked'; then
              echo "ERROR: dynamically linked binary detected: $binary"
              file "$binary"
              exit 1
            fi
          done

          for archive in dist/*.tar.gz; do tar -tzf "$archive" >/dev/null; done
          for archive in dist/*.zip; do unzip -tq "$archive"; done
          (cd dist && sha256sum * > SHA256SUMS)
          sha256sum dist/SHA256SUMS

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.release.outputs.tag }}"
          target="${{ steps.release.outputs.ref }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; replacing assets."
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --target "$target" --title "APT Proxy $tag" --generate-notes
          fi
