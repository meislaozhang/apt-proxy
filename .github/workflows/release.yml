name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Test
        run: |
          go test ./...
          go test -race ./...
          go vet ./...
      - name: Build release artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for os in linux windows darwin; do
            for arch in amd64 arm64; do
              ext=""
              if [[ "$os" == "windows" ]]; then ext=".exe"; fi
              GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags='-s -w' -o "dist/apt-server-${os}-${arch}${ext}" ./cmd/apt-server
              GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags='-s -w' -o "dist/apt-client-${os}-${arch}${ext}" ./cmd/apt-client
            done
          done
          sha256sum dist/* > dist/SHA256SUMS
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*
