name: tcp-core-soak

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'internal/**'
      - 'cmd/**'
      - '.github/workflows/tcp-core-soak.yml'

jobs:
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Repeated functional lifecycle
        run: |
          set -euo pipefail
          for i in $(seq 1 10); do
            echo "functional iteration ${i}/10"
            go test -timeout 2m ./...
          done
      - name: Repeated race lifecycle
        run: |
          set -euo pipefail
          for i in $(seq 1 3); do
            echo "race iteration ${i}/3"
            go test -timeout 4m -race ./...
          done
      - name: Final vet and build
        run: |
          set -euo pipefail
          go vet ./...
          go build ./cmd/apt-server
          go build ./cmd/apt-client
